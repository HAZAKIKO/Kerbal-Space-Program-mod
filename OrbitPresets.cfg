// =====================================================================
//  OrbitPresets.cfg  --  轨道预设数据节点 (纯数据, 不改任何原版天体)
//
//  这些节点只被 ModuleManager 装载进 GameDatabase, 供:
//    * 其他 mod / 插件按名字取参数
//    * 人类照着填 kOS 脚本里的四个入轨参数
//  对应的 kOS 侧副本在 Ships/Script/lib/orbit_presets.ks
//
//  高度单位 m, 角度单位 deg, 周期/速度为按二体公式算出的理论值。
//  地球: R = 6371 km, mu = 3.986004418E14
//  Kerbin: R = 600 km, mu = 3.5316E12
// =====================================================================

