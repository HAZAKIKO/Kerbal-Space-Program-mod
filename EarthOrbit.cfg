// =====================================================================
//  EarthOrbit.cfg  --  把 Kerbin 变成"地球"的天体参数
//
//  依赖:  ModuleManager (必需, 否则本文件整体不生效)
//         Kopernicus    (可选, 用 :NEEDS[Kopernicus] 保护)
//
//  数据来源: WGS84 / IERS Conventions / NASA JPL (详见 docs/orbit-parameters.md)
//
//  ★ 安全说明
//    下面 @Kopernicus 补丁默认只改"不会触发地形/贴图重载"的数值
//    (显示名 + 恒星日自转周期 + 大气顶高)。把半径改成 6371 km 会连带
//    需要 PQS/地形/贴图一起换, 那是 RealSolarSystem 的活, 所以那几行
//    默认注释掉; 需要时取消注释, 但请先备份存档。
// =====================================================================

// ---------------------------------------------------------------------
//  1) 机器可读的地球参数数据节点 (任何 mod / kOS 数据表都可引用)
// ---------------------------------------------------------------------
KERBIN_EARTH_PARAMS
{
    name = KerbinEarthParams
    // ---- 形状 ----
    equatorialRadius   = 6378137          // m, WGS84 赤道半径
    meanRadius         = 6371008.8        // m, 平均半径
    polarRadius        = 6356752.3        // m
    flattening         = 0.00335281066474 // 1/298.257223563
    // ---- 引力 ----
    mu                 = 3.986004418E+14  // m^3/s^2
    mass               = 5.9722E+24       // kg
    surfaceGravity     = 9.80665          // m/s^2
    J2                 = 0.00108262668
    J3                 = -2.53241052E-06
    J4                 = -1.6198976E-06
    // ---- 自转 ----
    siderealRotation   = 86164.0905       // s = 23h56m04.0905s
    solarDay           = 86400            // s
    axialTilt          = 23.4392811       // deg
    // ---- 环境 ----
    atmosphereTop      = 140000           // m (实用上限, 卡门线 100 km)
    karmanLine         = 100000           // m
    soiRadius          = 9.24E+08         // m
    escapeVelocity     = 11186            // m/s @ 平均半径
    // ---- 日心轨道 (J2000) ----
    sunSemiMajorAxis   = 1.49598023E+11   // m = 1 AU
    sunEccentricity    = 0.0167086
    sunInclination     = 0.00005          // deg (对黄道)
    sunLan             = -11.26064        // deg
    sunArgPeriapsis    = 114.20783        // deg
    sunMeanAnomaly     = 358.617          // deg
    sunOrbitalPeriod   = 31558149.8       // s = 365.256363 d
}

// ---------------------------------------------------------------------
//  2) 可选的 Kopernicus 补丁 (只在天体系统装了 Kopernicus 时生效)
// ---------------------------------------------------------------------
@Kopernicus:NEEDS[Kopernicus]:FOR[KerbinEarthOrbit]
{
    @Body[Kerbin]
    {
        @Properties
        {
            // ---- 安全项 ----
            @displayName     = Earth
            @rotationPeriod  = 86164.0905    // 恒星日 (原 21549.425)
            @tidallyLocked   = false
            @isHomeWorld     = true

            // ---- 破坏性项: 需要配套地形/贴图 (RSS 级别) 才可启用 ----
            // @radius  = 6371008.8           // 原 600000
            // @geeASL  = 1.0                 // 表面重力 9.80665 m/s^2
            // @mass    = 5.9722E+24          // 决定 mu
        }

        // 大气顶高: 原地形高度场按 70 km 调的, 改大会让高层大气变稀薄区
        // 先只改上限, 不动压力曲线
        @Atmosphere
        {
            @maxAltitude      = 140000
            @staticPressureASL = 101.325
        }

        // ---- 日心轨道: 把 Kerbin 放到 1 AU ----
        // 注意: 这会改变整个存档的尺度观感 (Kerbol 会显得很小), 默认注释。
        // @Orbit
        // {
        //     @semiMajorAxis              = 1.49598023E+11
        //     @eccentricity               = 0.0167086
        //     @inclination                = 0.00005
        //     @longitudeOfAscendingNode   = -11.26064
        //     @argumentOfPeriapsis        = 114.20783
        //     @meanAnomalyAtEpoch         = 358.617
        // }
    }
}

// =====================================================================
//  OrbitPresets.cfg  --  轨道预设数据节点 (纯数据, 不改任何原版天体)
//
//  这些节点只被 ModuleManager 装载进 GameDatabase, 供:
//    * 其他 mod / 插件按名字取参数
//    * 人类照着填 kOS 脚本里的四个入轨参数
//  对应的 kOS 侧副本在 Ships/Script/lib/orbit_presets.ks
//
//  高度单位 m, 角度单位 deg, 周期/速度为按二体公式算出的理论值。
//  地球: R = 6371 km, mu = 3.986004418E14
//  Kerbin: R = 600 km, mu = 3.5316E12
// =====================================================================

